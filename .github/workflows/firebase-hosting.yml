name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - dev
      - "*"   # qualquer branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install -g firebase-tools

      # Deploy para produção quando for o branch main
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting --project metaday-fatecsebrae --token "${{ secrets.FIREBASE_TOKEN }}"

      # Pré-visualização automática para outros branches
      - name: Deploy Preview Channel
        if: github.ref != 'refs/heads/main'
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          firebase hosting:channel:deploy $BRANCH_NAME --project metaday-fatecsebrae --token "${{ secrets.FIREBASE_TOKEN }}"