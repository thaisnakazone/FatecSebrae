<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Day - Lia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tela-nome">
  <h1>Digite seu nome para começar</h1>
  <input id="nome" placeholder="Seu nome">
  <button onclick="iniciar()">Entrar</button>
</div>

<div id="tela-menu" style="display:none;">
  <img id="avatar" src="avatar_fechada.png" alt="Avatar da Lia">
  <h3 id="saudacao"></h3>
  <p id="frase" style="font-size: 17px;"></p>
  <div id="botoes"></div>
  <p id="info" style="font-size: 17px;"></p>
</div>

<script src="app.js"></script>

<!-- VLibras Widget -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
