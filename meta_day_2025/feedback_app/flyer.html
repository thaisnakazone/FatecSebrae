<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meta Day Fatec Sebrae 2025 — Flyer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root { --brand-font: 'Inter', system-ui, Roboto, Arial, sans-serif; }
    body { font-family: var(--brand-font); }
    html,body{height:100%;margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
    .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}
    .card{width:900px;max-width:96%;background:var(--card);border-radius:var(--radius);box-shadow:0 10px 30px rgba(12,20,40,0.08);display:flex;gap:28px;padding:34px;align-items:center}
    .left{flex:1;padding-right:8px}
    .title{color:var(--accent);font-weight:800;letter-spacing:0.6px;margin:0;font-size:36px;line-height:1.02}
    .title small{display:block;font-size:18px;color:var(--accent);font-weight:700}
    .subtitle{margin:16px 0 26px;color:var(--muted);font-size:18px}
    .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
    .qr{width:240px;height:240px;border-radius:10px;padding:10px;background:#fff;box-shadow:0 8px 22px rgba(12,20,40,0.06);display:block}
    .note{font-size:13px;color:#9aa3ad;text-align:center}
    .btns{display:flex;gap:10px;align-items:center;margin-top:6px}
    .btn{background:var(--cta);color:#fff;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
    .lia-wrap{width:220px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .lia{width:200px;height:auto;border-radius:14px;box-shadow:0 8px 30px rgba(12,20,40,0.06);background:linear-gradient(180deg,#fff 0%,#fff0 100%);display:block}
    .footer{font-size:12px;color:#9aa3ad;margin-top:8px;text-align:left}
    @media (max-width:880px){ .card{flex-direction:column;padding:20px} .lia-wrap{order:-1} .left{text-align:center} .footer{text-align:center} }
    @media print {
      body{background:#fff}
      .stage{padding:0}
      .card{box-shadow:none;border-radius:6px;padding:34px;width:var(--paper-w);height:var(--paper-h);box-sizing:border-box}
      .btn{display:none}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card" id="flyer">
      <div class="left">
        <h1 class="title">META DAY <small>FATEC SEBRAE 2025</small></h1>
        <p class="subtitle">Deixe seu feedback e contribua para experiências cada vez melhores!</p>

        <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
          <div class="qr-wrap" aria-hidden="false">
            <img id="qr" class="qr" alt="QR Code para Meta Day Fatec Sebrae" src="" />
            <div class="note">Aponte a câmera para o QR code para acessar o formulário</div>
          </div>

          <div style="flex:1;min-width:180px">
            <div class="footer">Meta Day Fatec Sebrae 2025<br>Feedback • Contribua • Melhore experiências</div>
            <div class="btns">
              <button id="generatePdf" class="btn">Gerar PDF</button>
              <button id="openLink" class="btn" style="background:#0b3b66">Abrir formulário</button>
            </div>
          </div>
        </div>
      </div>

      <div class="lia-wrap">
        <img id="liaImg" class="lia" src="lia.png" alt="Lia — Meta Day Fatec Sebrae" onerror="this.style.display='none'" />
      </div>
    </div>
  </div>

  <script>
    // Link alvo do QR
    var targetUrl = 'https://metaday-fatecsebrae.web.app/';

    // Gera URL do QR code (serviço público)
    function makeQrUrl(data, size) {
      size = size || 512;
      return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(data) + '&format=png';
    }

    // coloca o QR no img; faz retry simples
    var qrImg = document.getElementById('qr');
    function loadQr() {
      qrImg.src = makeQrUrl(targetUrl, 512);
    }
    loadQr();

    // abrir link diretamente
    document.getElementById('openLink').addEventListener('click', function () {
      window.open(targetUrl, '_blank');
    });

    // Gerar PDF: abre nova janela com HTML construído via concatenação de strings
    document.getElementById('generatePdf').addEventListener('click', function () {
      var flyer = document.getElementById('flyer').cloneNode(true);

      // remover botões do clone (segurança)
      var btn = flyer.querySelector('#generatePdf');
      if (btn) btn.parentNode.removeChild(btn);
      var openBtn = flyer.querySelector('#openLink');
      if (openBtn) openBtn.parentNode.removeChild(openBtn);

      // obter src do QR e Lia (se existirem)
      var qrSrc = '';
      var liaSrc = '';
      var qrEl = flyer.querySelector('#qr');
      if (qrEl) qrSrc = qrEl.getAttribute('src') || '';
      var liaEl = flyer.querySelector('#liaImg');
      if (liaEl) liaSrc = liaEl.getAttribute('src') || '';

      // construir HTML da janela de impressão usando concatenação (evita template literal)
      var docHtml = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Day Fatec Sebrae 2025 — Flyer</title>';
      docHtml += '<style>';
      docHtml += 'body{margin:0;padding:48px;display:flex;justify-content:center;align-items:center;font-family:Inter,Roboto,Arial,sans-serif;background:#fff}';
      docHtml += '.card{width:794px;height:1123px;box-shadow:none;border-radius:10px;padding:48px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}';
      docHtml += 'h1{color:#0b3b66;font-size:40px;margin:0 0 12px;font-weight:800;letter-spacing:0.6px}';
      docHtml += 'h1 small{display:block;font-size:20px}';
      docHtml += 'p.lead{color:#4b5563;font-size:20px;margin:0 0 20px}';
      docHtml += '.center{display:flex;gap:36px;align-items:center;justify-content:center}';
      docHtml += '.qr{width:300px;height:300px;border-radius:12px}';
      docHtml += '.lia{width:260px;border-radius:12px}';
      docHtml += '.footer{font-size:12px;color:#9aa3ad;margin-top:18px;text-align:center}';
      docHtml += '</style></head><body>';
      docHtml += '<div class="card">';

      // título e subtítulo
      var titleEl = flyer.querySelector('.title');
      if (titleEl) {
        docHtml += '<div>' + titleEl.outerHTML + '</div>';
      } else {
        docHtml += '<div><h1>META DAY <small>FATEC SEBRAE 2025</small></h1></div>';
      }
      var subEl = flyer.querySelector('.subtitle');
      if (subEl) {
        // escape texto simples
        var subText = subEl.textContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        docHtml += '<div><p class="lead">' + subText + '</p></div>';
      } else {
        docHtml += '<div><p class="lead">Deixe seu feedback e contribua para experiências cada vez melhores!</p></div>';
      }

      // centro com qr e lia
      docHtml += '<div class="center">';
      if (qrSrc) {
        docHtml += '<img class="qr" src="' + qrSrc + '" />';
      }
      if (liaSrc) {
        docHtml += '<img class="lia" src="' + liaSrc + '" />';
      }
      docHtml += '</div>';

      docHtml += '<div class="footer">Meta Day Fatec Sebrae 2025 • Deixe seu feedback</div>';
      docHtml += '</div>'; // card
      docHtml += '<script>window.onload=function(){setTimeout(function(){window.print();},120);};<\/script>';
      docHtml += '</body></html>';

      var w = window.open('', '_blank');
      w.document.open();
      w.document.write(docHtml);
      w.document.close();
    });

    // tentativa de pré-carregar a imagem da Lia e ocultar caso falhe
    (function checkLia(){
      var lia = document.getElementById('liaImg');
      if (!lia) return;
      var img = new Image();
      img.onload = function(){ /* ok */ };
      img.onerror = function(){ lia.style.display = 'none'; };
      img.src = lia.src;
    })();
  </script>
</body>
</html>
