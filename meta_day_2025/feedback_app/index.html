<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback - Metaday Fatec Sebrae</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #feedbackList { margin-top: 30px; }
    .feedback-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
    .feedback-item strong { color: #333; }
    #loginForm { margin-bottom: 20px; }
    #statusMsg { margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Deixe seu feedback</h1>

  <!-- Formulário de login do admin -->
  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Senha" required />
    <button id="loginBtn" type="button">Login</button>
    <button id="logoutBtn" type="button" style="display:none;">Sair</button>
    <p id="userStatus"></p>
  </div>

  <!-- Formulário de envio (liberado para todos) -->
  <form id="feedbackForm">
    <label for="nome">Nome:</label><br />
    <input type="text" id="nome" name="nome" /><br /><br />

    <label for="mensagem">Mensagem:</label><br />
    <textarea id="mensagem" name="mensagem" required></textarea><br /><br />

    <button type="submit">Enviar</button>
    <p id="statusMsg"></p>
  </form>

  <!-- Container para listagem (só admin vê) -->
  <div id="feedbackList" style="display:none;">
    <h2>Feedbacks enviados</h2>
    <div id="feedbackContainer"></div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, connectFirestoreEmulator,
      query, orderBy, onSnapshot
    } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
    import {
      getAuth, connectAuthEmulator, signInWithEmailAndPassword, signOut, onAuthStateChanged,
      setPersistence, inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    // 🔑 Configuração Firebase (substitua pelos dados reais do seu projeto)
    const firebaseConfig = {
      apiKey: "AIzaSyBinNESW5Am9fV-5EH4hEfBvhxgqwfRwfE",
      authDomain: "metaday-fatecsebrae.firebaseapp.com",
      projectId: "metaday-fatecsebrae",
      storageBucket: "metaday-fatecsebrae.firebasestorage.app",
      messagingSenderId: "813356147967",
      appId: "1:813356147967:web:40ec819dee718dd4e0d8ca",
      measurementId: "G-8Y56FGSNVL"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 🔒 Persistência só em memória → sempre desloga no refresh
    setPersistence(auth, inMemoryPersistence)
      .then(() => {
        console.log("Persistência definida como 'inMemory' (sempre desloga no refresh)");
      })
      .catch((error) => {
        console.error("Erro ao definir persistência:", error);
      });

    // Se estiver rodando local, conecta aos emuladores
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      console.log("Conectado aos Emuladores");
      connectFirestoreEmulator(db, "localhost", 8081);
      connectAuthEmulator(auth, "http://localhost:9099");
    }

    // Login/Logout do admin
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userStatus = document.getElementById("userStatus");
    const feedbackList = document.getElementById("feedbackList");

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error("Erro no login:", error);
        alert("Falha no login. Verifique email e senha.");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
    });

    // Envio de feedback (liberado para todos)
    const form = document.getElementById("feedbackForm");
    const statusMsg = document.getElementById("statusMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nome = document.getElementById("nome").value || "Anônimo";
      const mensagem = document.getElementById("mensagem").value;

      try {
        await addDoc(collection(db, "feedbacks"), {
          nome: nome,
          mensagem: mensagem,
          criadoEm: new Date()
        });
        form.reset();
        statusMsg.textContent = "✅ Feedback enviado com sucesso!";
        statusMsg.style.color = "green";
        setTimeout(() => statusMsg.textContent = "", 3000);
      } catch (error) {
        console.error("Erro ao salvar feedback:", error);
        statusMsg.textContent = "❌ Erro ao enviar feedback. Tente novamente.";
        statusMsg.style.color = "red";
      }
    });

    // Listagem de feedbacks (só admin logado vê)
    const feedbackContainer = document.getElementById("feedbackContainer");
    let unsubscribe = null;

    onAuthStateChanged(auth, (user) => {
      if (user && user.email === "fatecsebrae@metaday.com.br") {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline";
        userStatus.textContent = `Logado como: ${user.email}`;
        feedbackList.style.display = "block";

        const q = query(collection(db, "feedbacks"), orderBy("criadoEm", "desc"));
        unsubscribe = onSnapshot(q, (snapshot) => {
          feedbackContainer.innerHTML = "";
          snapshot.forEach((doc) => {
            const data = doc.data();
            const div = document.createElement("div");
            div.className = "feedback-item";
            div.innerHTML = `<strong>${data.nome}</strong>: ${data.mensagem}`;
            feedbackContainer.appendChild(div);
          });
        });
      } else {
        loginBtn.style.display = "inline";
        logoutBtn.style.display = "none";
        userStatus.textContent = "";
        feedbackList.style.display = "none";
        if (unsubscribe) unsubscribe();
      }
    });
  </script>
</body>
</html>
