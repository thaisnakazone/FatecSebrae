<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sorteio do Meta Day Fatec Sebrae</title>
  <style>
    body { font-family: Inter,system-ui,Arial,sans-serif; background:#0b3b66; color:#fff;
      display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:24px;box-sizing:border-box }
    .card { background:linear-gradient(180deg,#123a5a 0%, #0b2d48 100%); padding:28px;border-radius:12px;
      box-shadow:0 8px 40px rgba(0,0,0,0.45); width:920px; max-width:95%; text-align:center }
    h1{ margin:0 0 12px; font-size:28px; color: gold; }
    .ticker{ height:80px; display:flex;align-items:center;justify-content:center; overflow:hidden;
      border-radius:8px; background:rgba(255,255,255,0.06); margin:12px 0; padding:8px }
    .nameBig{ font-size:28px; font-weight:700; letter-spacing:0.4px }
    .controls{ margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
    .controls + .hint { margin-top:22px; }
    button.primary{ background:#ffb703; color:#0b2d48; padding:12px 20px; border-radius:10px;
      border:none; cursor:pointer; font-weight:800; font-size:16px }
    button.secondary{ background:#0a84ff; color:#fff; padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:700 }
    button.ghost{ background:transparent; border:1px solid rgba(255,255,255,0.12); color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer }
    .result{ margin-top:18px; background:rgba(255,255,255,0.03); padding:14px; border-radius:10px;
      display:none; flex-direction:column; gap:6px; align-items:center }
    .label { font-size:13px; color:#cfe8ff; opacity:0.95; margin-bottom:6px }
    .winnerContact{ font-size:18px; color:#e0f2ff; font-weight:700; min-height:1.2em; }
    .small{ font-size:13px; color:#cfe8ff }
    .hint{ font-size:13px; color:#cfe8ff; opacity:0.9 }
    .toast { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); color: #fff; padding:10px 14px; border-radius:8px; display:none; }
    /* esconde permanentemente o badge de carregamento */
    #participantsLoadedBadge,
    .participants-loaded-badge {
      display: none !important;
    }
    #confetti-canvas { position: fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:9999 }

    /* relógio container: localTime + countdown side by side */
    #recordClock { margin-top: 12px; display:inline-block; }
    #localTime { display:inline-block; min-width:170px; text-align:center; color:#cfe8ff; font-size:14px; font-weight: 600;
      background: rgba(255,255,255,0.02); padding:6px 10px; border-radius:8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    #countdown { display:inline-block; margin-left:12px; font-weight: 600; font-size: 14px;
      min-width:156px; text-align:center; color:#e382ec; font-size:13px;
      background: rgba(255,255,255,0.02); padding:6px 10px; border-radius:8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div class="card" role="main" aria-live="polite">
    <h1>Sorteio do Meta Day Fatec Sebrae</h1>

    <div id="recordClock" title="Relógio para gravação" aria-live="polite">
      <span id="localTime">--/--/---- --:--:--</span>
      <span id="countdown">INICIA EM: 00h 00m 00s</span>
    </div>

    <div class="ticker" id="ticker" style="margin-top:10px;">
      <div class="nameBig" id="tickerName">— carregando participantes —</div>
    </div>

    <div class="controls">
      <button id="startBtn" class="primary" aria-controls="ticker" style="display:none">Iniciar Sorteio</button>
      <button id="revealBtn" class="secondary" disabled title="Revela o contato completo em ambiente privado">REVELAR CONTATO (privado)</button>
      <button id="resetBtn" class="ghost" style="display:none">Resetar</button>
    </div>

    <div class="hint">O sorteio rodará automaticamente às 19h (UTC-03:00 — São Paulo).</div>

    <div class="result" id="result" aria-hidden="true">
      <div class="label">Contato informado:</div>
      <div class="winnerContact" id="winnerContact"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // === Configuração: apenas mude esta URL se necessário ===
    const REMOTE_JSON = 'https://storage.googleapis.com/meu-bucket-participantes-1762359852/participantes.json?x-goog-signature=1c9772e8f27e4993711e941f62ee2909f44ec86ad359a0f273024dc8b1728714d3c424bff234efe674e4f0a8f864e9cbd77d6e419ac8feb5dbd1eb696597198c9dea5fdf00d8a2abc591a6b3b056837c226015a5479c7d6fbe92dcf6d8640170d33521f250449442ddfaeef10cd7fbca719464a509094682df9af787e6c8614d09aeeba8c27984a9c60e9a95c7e07fc4479f4941af632f6cffacaaa4c6a802064acbc770b82330a483686a28b1cd17db8e6faa1ca36bee94b25ca83aac38f061833b7177fa9da15159530999a3fd5847b57ca3b0cd9e4f51ff7941065f1da7b7b74d3689b9c60327287f549d768d3070200341cfe538f148ead44e84a2b86814&x-goog-algorithm=GOOG4-RSA-SHA256&x-goog-credential=signurl-svc%40metaday-fatecsebrae.iam.gserviceaccount.com%2F20251105%2Fus%2Fstorage%2Fgoog4_request&x-goog-date=20251105T174659Z&x-goog-expires=43200&x-goog-signedheaders=host';
    const LOCAL_JSON = 'https://storage.googleapis.com/meu-bucket-participantes-1762359852/lista_sorteio.json';

    const participants = [];

    function showToast(msg, ms = 2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._hid);
      t._hid = setTimeout(() => { t.style.display = 'none'; }, ms);
    }

    function ensureMasked(contact) {
      if (!contact) return '';
      if (contact.includes('@')) {
        const parts = contact.split('@');
        const user = parts[0] || '';
        const dom = parts[1] || '';
        return (user[0] || '*') + '***@' + dom;
      }
      const digits = contact.replace(/\D/g, '');
      const last4 = digits.slice(-4);
      return '(***) ****-' + last4;
    }

    function normalizeRecord(r) {
      return {
        document_name: r.document_name || r.documentName || null,
        document_id: r.document_id || r.documentId || null,
        nome_masked: (r.nome_masked && r.nome_masked.trim()) ? r.nome_masked.trim() : (r.nome || '').trim(),
        nome: (r.nome || '').trim(),
        contato_masked: (r.contato_masked && r.contato_masked.trim()) ? r.contato_masked.trim() : ensureMasked(r.contato || ''),
        contato_full: r.contato || r.contato_full || null,
        comentarios: r.comentarios || '',
        id_opaco: r.id_opaco || r.id || null,
        criadoEm: r.criadoEm || r.criado_ts || null
      };
    }

    function extractContactFromComments(text) {
      if (!text) return null;
      const emailMatch = text.match(/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})/);
      if (emailMatch) return { type: 'email', value: emailMatch[1] };
      const phoneMatch = text.match(/(\(?\d{2}\)?[\s.\-]*9?\d{4}[\s.\-]*\d{4})/);
      if (phoneMatch) {
        const digits = phoneMatch[1].replace(/\D/g,'');
        return { type: 'phone', value: digits };
      }
      return null;
    }

    // confetti init
    const confettiCanvas = document.getElementById('confetti-canvas');
    let confettiFn = null;
    let confettiActive = false;
    try {
      if (typeof confetti === 'function') {
        confettiFn = confetti.create(confettiCanvas, { resize: true, useWorker: false });
      }
    } catch (err) { confettiFn = null; }

    function fireConfetti() {
      if (!confettiFn || confettiActive) return;
      confettiActive = true;
      const duration = 1800;
      const end = Date.now() + duration;
      (function frame() {
        confettiFn({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0.25 }, colors: ['#ffb703','#0a84ff','#34d399','#f97316'] });
        confettiFn({ particleCount: 6, angle: 120, spread: 55, origin: { x: 0.75 }, colors: ['#ffb703','#0a84ff','#34d399','#f97316'] });
        if (Date.now() < end) requestAnimationFrame(frame);
        else confettiActive = false;
      })();
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // DOM refs
    const tickerName = document.getElementById('tickerName');
    const startBtn = document.getElementById('startBtn');
    const revealBtn = document.getElementById('revealBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultEl = document.getElementById('result');
    const winnerContactEl = document.getElementById('winnerContact');

    let animInterval = null;
    let autoTimeout = null;
    let currentList = [];
    let lastShownIndex = 0;
    let finalWinner = null;

    // === substitui loadParticipantsLocal por fetch remoto + fallback local ===
    async function loadParticipantsRemote(remoteUrl = REMOTE_JSON, localUrl = LOCAL_JSON) {
      try {
        const cacheBuster = (remoteUrl.includes('x-goog-signature') ? '' : (remoteUrl.includes('?') ? '&' : '?') + `t=${Date.now()}`);
        const fullUrl = remoteUrl + cacheBuster;
        console.log('Tentando carregar remote:', fullUrl);
        const res = await fetch(fullUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const normalized = data.map(normalizeRecord);
        participants.splice(0, participants.length, ...normalized);
        finishParticipantsLoad();
      } catch (err) {
        console.warn('Falha ao carregar remoto, tentando local', err);
        try {
          const resLocal = await fetch(localUrl, { cache: 'no-store' });
          if (!resLocal.ok) throw new Error('HTTP local ' + resLocal.status);
          const dataLocal = await resLocal.json();
          const normalizedLocal = dataLocal.map(normalizeRecord);
          participants.splice(0, participants.length, ...normalizedLocal);
          finishParticipantsLoad();
        } catch (errLocal) {
          console.error('Falha ao carregar lista local também', errLocal);
          if (tickerName) tickerName.textContent = 'Erro ao carregar participantes';
          if (startBtn) startBtn.disabled = true;
          if (revealBtn) revealBtn.disabled = true;
          showToast('Falha ao carregar lista. Verifique URL e CORS.');
        }
      }
    }

    // mantém comportamento original: não mostrar primeiro nome; start permanece oculto; reveal só habilita ao fim
    function finishParticipantsLoad() {
      if (tickerName) tickerName.textContent = '';
      if (startBtn) { startBtn.disabled = true; startBtn.style.display = 'none'; }
      if (revealBtn) revealBtn.disabled = true;
      currentList = shuffle(participants.slice());
      showToast(`Participantes carregados (${participants.length})`);
    }

    function startTicker() {
      if (!participants || participants.length === 0) {
        tickerName.textContent = 'Nenhum participante disponível';
        return;
      }
      startBtn && (startBtn.disabled = true);
      startBtn && (startBtn.textContent = 'Sorteando...');
      revealBtn && (revealBtn.disabled = true);
      resultEl.style.display = 'none';
      finalWinner = null;
      currentList = shuffle(participants);
      lastShownIndex = 0;

      animInterval = setInterval(() => {
        const p = currentList[lastShownIndex];
        tickerName.textContent = (p.nome_masked && p.nome_masked.trim()) ? p.nome_masked : (p.contato_masked || '—');
        lastShownIndex = (lastShownIndex + 1) % currentList.length;
      }, 80);

      if (autoTimeout) clearTimeout(autoTimeout);
      autoTimeout = setTimeout(() => {
        if (animInterval) { clearInterval(animInterval); animInterval = null; }
        const winner = pickWinnerRandom();
        if (winner) {
          revealWinner(winner);
          try { fireConfetti(); } catch (e) { console.warn('confetti erro', e); }
        }
        startBtn && (startBtn.textContent = 'Sorteio concluído');
        revealBtn && (revealBtn.disabled = false);
        resetBtn.style.display = 'inline-block';
      }, 5000);
    }

    function pickWinnerRandom() {
      const pool = participants.slice();
      if (pool.length === 0) return null;
      const idx = Math.floor(Math.random() * pool.length);
      return pool[idx];
    }

    function revealWinner(winner) {
      finalWinner = winner;
      winnerContactEl.textContent = winner.contato_masked || ensureMasked(winner.contato_full || '');
      resultEl.style.display = 'block';
      tickerName.textContent = (winner.nome_masked && winner.nome_masked.trim()) ? winner.nome_masked : (winner.contato_masked || '—');
      resultEl.setAttribute('aria-hidden', 'false');
    }

    async function handleRevealClick() {
      if (!finalWinner) {
        showToast('Nenhum vencedor definido ainda', 1800);
        return;
      }

      let contactFull = finalWinner.contato_full || null;
      const fullName = finalWinner.nome && finalWinner.nome.trim() ? finalWinner.nome.trim() : null;

      if (!contactFull && finalWinner.comentarios) {
        const found = extractContactFromComments(finalWinner.comentarios);
        if (found) {
          contactFull = (found.type === 'phone') ? found.value.replace(/\D/g,'') : found.value;
        }
      }

      if (contactFull) {
        const digits = contactFull.replace(/\D/g,'');
        const isPhone = /^\d{10,13}$/.test(digits);
        const display = isPhone ? ('+' + digits) : contactFull;
        winnerContactEl.textContent = display;
        await copyToClipboard(`${fullName || ''} — ${display}`);
        showToast('Contato revelado e copiado para a área de transferência', 3200);
        return;
      }

      showToast('Contato completo não disponível localmente. Configure lookup seguro se necessário.', 3800);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          return true;
        }
      } catch (err) {
        console.error('Falha ao copiar para clipboard:', err);
        return false;
      }
    }

    function resetAll() {
      if (animInterval) clearInterval(animInterval);
      if (autoTimeout) clearTimeout(autoTimeout);
      animInterval = null;
      autoTimeout = null;
      finalWinner = null;
      resultEl.style.display = 'none';
      tickerName.textContent = '';
      startBtn && (startBtn.disabled = false);
      startBtn && (startBtn.textContent = 'Iniciar Sorteio');
      revealBtn && (revealBtn.disabled = true);
      resetBtn.style.display = 'none';
      winnerContactEl.textContent = '';
    }

    // events
    startBtn && startBtn.addEventListener('click', startTicker);
    revealBtn && revealBtn.addEventListener('click', handleRevealClick);
    resetBtn && resetBtn.addEventListener('click', resetAll);
    startBtn && startBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startTicker(); } });

    // chama o carregamento remoto (tenta REMOTE_JSON e faz fallback para LOCAL_JSON)
    loadParticipantsRemote();

    window.addEventListener('beforeunload', () => {
      if (animInterval) clearInterval(animInterval);
      if (autoTimeout) clearTimeout(autoTimeout);
      stopLocalTime();
      stopCountdown();
    });

    // ---------- Relógio e Countdown sem "piscamento" ----------
    const localTimeEl = document.getElementById('localTime');
    const countdownEl = document.getElementById('countdown');

    function pad(n){ return n < 10 ? '0' + n : String(n); }
    function formatDateWithSeconds(d){
      const day = pad(d.getDate());
      const month = pad(d.getMonth() + 1);
      const year = d.getFullYear();
      const hh = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      return `${day}/${month}/${year} ${hh}:${mm}:${ss}`;
    }

    // atualiza horário local (suave)
    let localInterval = null;
    function startLocalTime(){
      if (!localTimeEl) return;
      function tickLocal(){
        localTimeEl.textContent = formatDateWithSeconds(new Date());
      }
      tickLocal();
      if (localInterval) clearInterval(localInterval);
      localInterval = setInterval(tickLocal, 250);
    }
    function stopLocalTime(){ if (localInterval) clearInterval(localInterval); localInterval = null; }
    startLocalTime();

    // --- Agendamento automático para 05/11/2025 19:00 (hora local) com countdown integrado ---
    (function scheduleAutoStart(){
      const target = new Date(2025, 10, 5, 18, 1, 0);
      const MAX_TIMEOUT = 2147483647;
      function msUntilTarget() { return target.getTime() - Date.now(); }

      function maybeStartNow() {
        if (!participants || participants.length === 0) {
          const retry = setInterval(() => {
            if (participants && participants.length > 0) {
              clearInterval(retry);
              startTicker();
            }
          }, 500);
        } else {
          startTicker();
        }
      }

      function startWhenReady() {
        const ms = msUntilTarget();
        if (ms <= 0) { maybeStartNow(); return; }
        if (ms <= MAX_TIMEOUT) {
          setTimeout(() => { maybeStartNow(); }, ms);
        } else {
          const checkInterval = 5 * 60 * 1000;
          const checker = setInterval(() => {
            if (msUntilTarget() <= MAX_TIMEOUT) {
              clearInterval(checker);
              setTimeout(() => { maybeStartNow(); }, msUntilTarget());
            }
          }, checkInterval);
        }
      }

      function two(n){ return String(n).padStart(2,'0'); }

      let countdownInterval = null;
      function startCountdown(msUntilTargetFn){
        if (!countdownEl) return;
        function tickCountdown(){
          const ms = msUntilTargetFn();
          if (ms <= 0){
            countdownEl.textContent = 'INICIA EM: 00h 00m 00s';
            return;
          }
          const totalSec = Math.floor(ms / 1000);
          const sec = totalSec % 60;
          const totalMin = Math.floor(totalSec / 60);
          const min = totalMin % 60;
          const hrs = Math.floor(totalMin / 60);
          const hrsStr = String(hrs).padStart(2,'0') + 'h';
          const minStr = two(min) + 'm';
          const secStr = two(sec) + 's';
          countdownEl.textContent = 'INICIA EM: ' + hrsStr + ' ' + minStr + ' ' + secStr;
        }
        tickCountdown();
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(tickCountdown, 1000);
      }
      function stopCountdown(){ if (countdownInterval) clearInterval(countdownInterval); countdownInterval = null; }

      // iniciar countdown e agendamento
      startCountdown(msUntilTarget);
      startWhenReady();
    })();
  </script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    function startCountdown(targetTs) {
      const el = document.getElementById('countdown');
      if (!el) return console.warn('Elemento #countdown não encontrado');
      console.log('DEBUG startCountdown target:', new Date(targetTs).toString());
      let timer = null;
      const tick = () => {
        const diff = targetTs - Date.now();
        if (diff <= 0) {
          clearInterval(timer);
          el.textContent = 'INICIANDO...';
          if (typeof window.startDraw === 'function') window.startDraw();
          else console.log('startDraw não encontrada');
          return;
        }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `INICIA EM: ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      };
      tick();
      timer = setInterval(tick, 1000);
    }

    function decideStart(scheduledTs) {
      console.log('DEBUG now:', new Date().toString());
      console.log('DEBUG scheduled:', new Date(scheduledTs).toString());
      const shouldStart = Date.now() >= scheduledTs;
      console.log('DEBUG shouldStart?', shouldStart);
      if (shouldStart) {
        console.log('DEBUG: condição de start verdadeira — segurando auto-start durante depuração');
        // comente a próxima linha enquanto depura para evitar start imediato:
        // if (typeof window.startDraw === 'function') window.startDraw();
      } else {
        startCountdown(scheduledTs);
      }
    }

    // Substitua a construção abaixo pelo seu scheduledTs real
    const now = new Date();
    const scheduledLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 19, 0, 0);
    decideStart(scheduledLocal.getTime());
  });
  </script>
</body>
</html>
